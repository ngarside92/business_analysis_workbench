function deleteArtifact(id){const selected=get(id);if(selected.type==='ACT'&&p.workflows.some(w=>usedBySteps(w.useCaseId,id).length))throw Error('Reassign or clear this actor on its workflow steps before deleting it.');const a=selected,rels=p.relationships.filter(r=>r.fromId===id||r.toId===id).length,maps=p.workflows.flatMap(w=>w.nodes).filter(n=>n.storyIds.includes(id)).length,w=p.workflows.find(w=>w.useCaseId===id);if(!confirm(`Delete ${a.code}? Removes ${rels} relationships, ${maps} step mappings${w?`, ${w.nodes.length} nodes and ${w.edges.length} edges`:''}. Undo is available.`))return;commit(()=>{p.artifacts=p.artifacts.filter(a=>a.id!==id);p.relationships=p.relationships.filter(r=>r.fromId!==id&&r.toId!==id);p.workflows=p.workflows.filter(w=>w.useCaseId!==id);p.workflows.forEach(w=>w.nodes.forEach(n=>{n.storyIds=n.storyIds.filter(s=>s!==id);if(n.traceIds)n.traceIds=n.traceIds.filter(s=>s!==id);if(n.traceCriteria)n.traceCriteria=n.traceCriteria.filter(s=>s.storyId!==id);}))},'Artifact and references deleted');$('modal').close()}
function matrix(){const rows=p.artifacts.filter(a=>a.type===matrixA),cols=p.artifacts.filter(a=>a.type===matrixB),es=graph(p);return `<div class="row between"><h2>Traceability matrix</h2>${button('Export matrix CSV','csv-matrix')}</div><div class="row toolbar"><label>Rows<select id="matrix-a">${options(TYPES,matrixA)}</select></label><label>Columns<select id="matrix-b">${options(TYPES,matrixB)}</select></label></div><p class="hint">Each cell shows stored direction (→ or ←) and type. Step-mapped links are derived from workflow nodes. Open a cell to inspect or add relationships.</p><div class="panel tablewrap"><table><tr><th>${matrixA} / ${matrixB}</th>${cols.map(a=>`<th>${button(esc(a.code),'edit:'+esc(a.id))}<br>${esc(a.title)}</th>`).join('')}</tr>${rows.map(a=>`<tr><th>${button(esc(a.code),'edit:'+esc(a.id))}<br>${esc(a.title)}</th>${cols.map(b=>`<td>${a.id===b.id?'—':button(es.filter(e=>e.fromId===a.id&&e.toId===b.id||e.fromId===b.id&&e.toId===a.id).map(e=>(e.fromId===a.id?'→ ':'← ')+esc(e.type)).join('<br>')||'+ Link','cell:'+p.artifacts.indexOf(a)+':'+p.artifacts.indexOf(b))}</td>`).join('')}</tr>`).join('')}</table></div>`}
function quality(){const rows=gaps(p),steps=p.workflows.flatMap(w=>w.nodes).filter(n=>['action','decision'].includes(n.type));return `<div class="row between"><h2>Coverage & quality</h2>${button('Export gap CSV','csv-gaps')}</div>${coverageSummary()}<p>Mapped actions and decisions: <b>${steps.filter(n=>n.storyIds.length).length} / ${steps.length}</b>. Start and End are excluded. Test coverage follows directed relationships and step mappings; it does not imply tests passed.</p><div class="panel tablewrap"><table><tr><th>Artifact / step</th><th>Finding</th><th>Detail</th></tr>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="3">No gaps found.</td></tr>'}</table></div>`}
function workflow(){const ucs=p.artifacts.filter(a=>a.type==='UC');if(!ucs.some(a=>a.id===uc)){uc=ucs[0]?.id||'';sel=null}if(uc&&!flow())commit(()=>p.workflows.push({id:uid(),useCaseId:uc,nodes:[],edges:[]}),'Created empty workflow',false);return `<div class="row between"><h2>Workflow designer</h2><div class="row">${button('Undo','undo')}${button('Redo','redo')}${button('+ New use case','new-uc','primary')}</div></div><div class="work"><aside><h3>Use cases</h3>${workflowFilter()}${ucs.filter(workflowMatches).map(a=>button(`<b>${esc(a.code)}</b><br>${esc(a.title)}`,'uc:'+esc(a.id),'ucbutton '+(uc===a.id?'active':''))).join('')||'<p class="hint">Create a use case to begin.</p>'}<hr><h3>User stories</h3><input id="story-search" placeholder="Search stories" aria-label="Search stories" value="${esc(storySearch)}"><div id="story-list">${storyList()}</div>${button('+ New story','new-story')}</aside><section><div class="row toolbar">${NODE_TYPES.map(t=>button('+ '+t[0].toUpperCase()+t.slice(1),'node:'+t)).join('')}${button(connect?'Cancel connection':'Connect steps','connect',connect?'active':'')}${button('−','zoom-out')}${button('+','zoom-in')}${button('Fit','fit')}</div><div id="mode" class="mode"></div><div id="canvas" class="canvas"><svg id="diagram" role="group" aria-label="Use case workflow canvas"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#597f8f"/></marker></defs><g id="edges"></g><g id="nodes"></g></svg></div><p class="hint">Drag a step to move it. Connect steps uses two clicks: source, then destination. Escape cancels. Delete removes the selection. Arrow keys move a focused step; Enter selects it.</p><details><summary>Readable flow and branches</summary><pre id="flow-text" style="white-space:pre-wrap;font:inherit;line-height:1.6"></pre>${button('Export flow text','flow-text-export')}</details></section><aside id="inspector"></aside></div>`}
function storyList(){return p.artifacts.filter(a=>a.type==='US'&&(a.code+' '+a.title).toLowerCase().includes(storySearch.toLowerCase())).map(a=>button(esc(a.code+' · '+a.title),'edit:'+esc(a.id),'ucbutton')).join('')||'<p class="hint">No matching stories.</p>'}
function newUC(){commit(()=>{const a=artifact(p,'UC','New use case');p.artifacts.push(a);p.workflows.push({id:uid(),useCaseId:a.id,nodes:[],edges:[]});uc=a.id;sel=null;connect=false;source=null;view='workflow'},'Use case created — canvas ready')}
function addNode(t){if(!flow()){notice('Create a use case first.');return}commit(()=>{const w=flow(),i=w.nodes.length;let k=1;while(w.nodes.some(n=>n.code==='STEP-'+k))k++;const n={id:uid(),code:'STEP-'+k,type:t,title:t==='decision'?'Decision?':t[0].toUpperCase()+t.slice(1),description:'',actor:'',outcome:'',x:50+(i%3)*230,y:65+Math.floor(i/3)*145,storyIds:[]};w.nodes.push(n);sel={kind:'node',id:n.id}},'Step added')}
function dimensions(){const ns=flow()?.nodes||[];return {w:Math.max(900,...ns.map(n=>n.x+260)),h:Math.max(650,...ns.map(n=>n.y+170))}}
function edgeGeometry(e,w){const a=w.nodes.find(n=>n.id===e.from),b=w.nodes.find(n=>n.id===e.to);if(a.id===b.id||(a.x===b.x&&a.y===b.y)){const y=a.y>=70?a.y:a.y+68, bend=a.y>=70?-65:65;return {d:`M${a.x+140} ${y} C${a.x+230} ${y+bend},${a.x-40} ${y+bend},${a.x+35} ${y}`,x:a.x+88,y:y+bend*.7};}let ax=a.x+90,ay=a.y+34,bx=b.x+90,by=b.y+34,dx=bx-ax,dy=by-ay;const f=1/Math.max(Math.abs(dx)/90,Math.abs(dy)/34);let sx=ax+dx*f,sy=ay+dy*f,tx=bx-dx*f,ty=by-dy*f;if(dx<0){let bend=Math.max(55,Math.abs(dx)*.15);return {d:`M${sx} ${sy} C${sx} ${sy+bend},${tx} ${ty+bend},${tx} ${ty}`,x:(sx+tx)/2,y:(sy+ty)/2+bend*.75-7}}return {d:`M${sx} ${sy} C${sx+(tx-sx)/2} ${sy},${sx+(tx-sx)/2} ${ty},${tx} ${ty}`,x:(sx+tx)/2,y:(sy+ty)/2-9}}
function drawEdges(){const w=flow();$('edges').innerHTML=w?w.edges.map(e=>{const g=edgeGeometry(e,w);return `<g class="edge ${sel?.id===e.id?'selected':''}" data-edge="${esc(e.id)}" tabindex="0" role="button" aria-label="Connector ${esc(e.label||'unlabelled')}"><path d="${g.d}" fill="none" stroke="transparent" stroke-width="18"/><path class="line" d="${g.d}" fill="none" stroke="#597f8f" stroke-width="2" marker-end="url(#arrow)" pointer-events="none"/><text x="${g.x}" y="${g.y}" text-anchor="middle">${esc(e.label)}</text></g>`}).join(''):''}
function draw(){if(!$('diagram'))return;const w=flow(),d=dimensions(),svg=$('diagram');svg.setAttribute('viewBox',`0 0 ${d.w} ${d.h}`);svg.setAttribute('width',d.w*zoom);svg.setAttribute('height',d.h*zoom);drawEdges();$('nodes').innerHTML=(w?.nodes||[]).map(n=>`<g class="node ${sel?.id===n.id?'selected':''} ${source===n.id?'source':''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.code+' '+n.title)}" transform="translate(${n.x} ${n.y})"><title>${esc(n.title)}</title>${n.type==='decision'?'<polygon class="shape" points="90,0 180,34 90,68 0,34" fill="#fff2d4" stroke="#b99b5c"/>':`<rect class="shape" width="180" height="68" rx="${['start','end'].includes(n.type)?34:8}" fill="${n.type==='start'?'#dcefe8':n.type==='end'?'#eee5ee':'#e5eff7'}" stroke="#89a5b2"/>`}<text x="90" y="28" text-anchor="middle">${esc(n.title.length>24?n.title.slice(0,22)+'…':n.title)}</text><text x="90" y="47" text-anchor="middle">${esc(n.code)} · ${(n.traceIds||[]).length} step traces</text></g>`).join('');updateMode();$('flow-text').textContent=flowText();svg.onpointerdown=pointerDown;svg.onpointermove=pointerMove;svg.onpointerup=pointerUp;svg.onpointercancel=pointerCancel;}
function updateMode(){if($('mode'))$('mode').textContent=!uc?'Create a use case to open its canvas.':connect?(source?'Source selected. Click a destination, or Escape to cancel.':'Connect mode: click the source step.'):'Select mode · '+Math.round(zoom*100)+'%';document.querySelector('[data-action="connect"]')?.classList.toggle('active',connect);const b=document.querySelector('[data-action="connect"]');if(b)b.textContent=connect?'Cancel connection':'Connect steps'}
function paintSelection(){document.querySelectorAll('[data-node]').forEach(g=>{g.classList.toggle('selected',sel?.id===g.dataset.node);g.classList.toggle('source',source===g.dataset.node)});document.querySelectorAll('[data-edge]').forEach(g=>g.classList.toggle('selected',sel?.id===g.dataset.edge));updateMode()}
function chooseNode(id){if(connect){if(!source){source=id;sel={kind:'node',id};paintSelection();inspect();return}const w=flow();if(w.edges.some(e=>e.from===source&&e.to===id)){notice('This directed connection already exists. Choose another target or cancel.');return}const from=source;commit(()=>{const e={id:uid(),from,to:id,label:''};w.edges.push(e);sel={kind:'edge',id:e.id};source=null;connect=false},'Directed connection created');return}sel={kind:'node',id};paintSelection();inspect()}
function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform($('diagram').getScreenCTM().inverse())}
function pointerDown(e){if(e.button!==0)return;const ng=e.target.closest?.('[data-node]'),eg=e.target.closest?.('[data-edge]');if(ng){e.preventDefault();e.stopPropagation();const id=ng.dataset.node;if(connect){chooseNode(id);return}chooseNode(id);const n=flow().nodes.find(n=>n.id===id),q=point(e);drag={id,start:q,x:n.x,y:n.y,pointer:e.pointerId,before:clone(p),moved:false};$('diagram').setPointerCapture(e.pointerId)}else if(eg&&!connect){sel={kind:'edge',id:eg.dataset.edge};paintSelection();inspect()}else if(!connect){sel=null;paintSelection();inspect()}}
function pointerMove(e){if(!drag)return;const q=point(e),n=flow().nodes.find(n=>n.id===drag.id);n.x=Math.max(0,Math.min(99900,Math.round(drag.x+q.x-drag.start.x)));n.y=Math.max(0,Math.min(99900,Math.round(drag.y+q.y-drag.start.y)));drag.moved=n.x!==drag.x||n.y!==drag.y;const g=[...$('nodes').children].find(g=>g.dataset.node===n.id);g.setAttribute('transform',`translate(${n.x} ${n.y})`);drawEdges()}
function pointerUp(e){if(!drag)return;const d=drag;drag=null;if($('diagram').hasPointerCapture(e.pointerId))$('diagram').releasePointerCapture(e.pointerId);if(d.moved){const n=flow().nodes.find(n=>n.id===d.id),x=n.x,y=n.y;p=d.before;commit(()=>Object.assign(flow().nodes.find(n=>n.id===d.id),{x,y}),'Step moved',false);draw();inspect()}}
function pointerCancel(){if(!drag)return;p=drag.before;drag=null;draw();inspect()}
function inspect(){const root=$('inspector');if(!root)return;const w=flow();if(!w){root.innerHTML='<h3>Workflow inspector</h3><p>Create a use case to start modelling.</p>';return}if(!sel){root.innerHTML=`<h3>${esc(get(uc).code)}</h3><p>${esc(get(uc).title)}</p>${button('Edit use case','edit:'+esc(uc))}${contextMarkup(uc)}<p class="hint">Select a step or connector to edit it.</p>`;return}const n=sel.kind==='node'?w.nodes.find(n=>n.id===sel.id):w.edges.find(n=>n.id===sel.id);if(!n){sel=null;inspect();return}root.innerHTML=sel.kind==='edge'?`<h3>Connector / branch</h3><form id="step-form">${input('Branch label','label',n.label)}<p class="hint">${esc(w.nodes.find(x=>x.id===n.from).title)} → ${esc(w.nodes.find(x=>x.id===n.to).title)}</p><button class="primary">Save connector</button></form>${button('Delete connector','delete-selection','danger')}`:`<h3>Workflow step</h3><form id="step-form">${input('Step code','code',n.code)}${input('Step title','title',n.title)}<label>Step type<select name="type">${options(NODE_TYPES,n.type)}</select></label>${performerField(n)}${input('Description','description',n.description,true)}${input('Expected outcome','outcome',n.outcome,true)}<button class="primary">Save step</button></form>${contextMarkup(uc)}${button('Edit use case associations','edit:'+esc(uc))}${stepTrace(n)}${button('Delete step','delete-selection','danger')}`;$('step-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);if(sel.kind==='node'&&(!fd.get('code').trim()||!fd.get('title').trim())){notice('Step code and title are required.');return}commit(()=>{for(const [k,v]of fd)writeStepField(n,k,v)},'Workflow selection updated',false);drawEdges();if(sel.kind==='node'){const g=[...$('nodes').children].find(g=>g.dataset.node===n.id);if(g)draw()}inspect()};if(sel.kind==='node')bindStepTrace(n);}
function mappingList(n,q=''){return p.artifacts.filter(a=>a.type==='US'&&(a.code+' '+a.title).toLowerCase().includes(q.toLowerCase())).map(a=>`<label class="check"><input type="checkbox" data-map="${esc(a.id)}" ${n.storyIds.includes(a.id)?'checked':''}>${esc(a.code+' · '+a.title)}</label>`).join('')||'<p class="hint">No matching stories.</p>'}
function deleteSelection(){if(!sel||!flow())return;const w=flow(),id=sel.id,kind=sel.kind,n=w.nodes.find(n=>n.id===id);if(!confirm(kind==='node'?`Delete ${n.code}? Removes ${w.edges.filter(e=>e.from===id||e.to===id).length} incident connectors and ${n.storyIds.length+(n.traceIds||[]).length+(n.traceCriteria||[]).length} trace links.`:'Delete this connector?'))return;commit(()=>{if(kind==='node'){w.nodes=w.nodes.filter(n=>n.id!==id);w.edges=w.edges.filter(e=>e.from!==id&&e.to!==id)}else w.edges=w.edges.filter(e=>e.id!==id);sel=null;source=null;connect=false},'Selection deleted')}
function flowText(){const w=flow();if(!w)return 'No use case selected.';return get(uc).code+' — '+get(uc).title+'\n\n'+w.nodes.map(n=>`${n.code} [${n.type}] ${n.title}\n${n.description||''}\nStories: ${n.storyIds.map(s=>get(s).code).join(', ')||'None'}\nExits: ${w.edges.filter(e=>e.from===n.id).map(e=>(e.label||'Unlabelled')+' → '+w.nodes.find(x=>x.id===e.to).code).join('; ')||'None'}`).join('\n\n')}
function files(){return `<h2>Save & handoff</h2><div class="two"><div class="panel"><h3>Durable snapshots</h3><p>Export creates a new download. It does not overwrite the HTML or JSON file you opened. Send one revision to the next editor, and ask them to export their changes.</p><div class="row">${button('Export JSON backup','export-json','primary')}${button('Export portable HTML','export-html')}${button('Open / replace project','open')}</div><p class="hint">Portable HTML includes the app and data. JSON is the complete project backup. CSV reports are review aids only.</p><p class="break">Project ID: ${esc(p.project.id)}<br>Revision: ${p.project.revision}<br>Editor: ${esc(p.project.editor||'Not set')}<br>Updated: ${esc(p.project.updatedAt)}<br>Source filename: ${esc(p.project.sourceFilename||'New project')}</p></div><div class="panel"><h3>Browser recovery copy</h3><label class="check"><input id="autosave" type="checkbox" ${p.settings.autosaveEnabled?'checked':''}>Enable browser autosave</label><p class="hint">Turning this off stops project writes; an existing recovery copy remains until cleared. Recovery is always offered for review, never silently applied over a portable snapshot.</p><div class="row">${button('Review browser copy','recover')}${button('Clear browser copy','clear-local')}</div><p class="hint">Storage can be blocked or cleared by your browser. Keep JSON backups.</p></div></div><div class="panel"><h3>Project actions</h3><div class="row">${button('New blank project','blank')}${button('Duplicate project','duplicate')}${button('Load sample project','sample')}${button('Undo','undo')}${button('Redo','redo')}</div><p class="hint">Open and sample loading replace the workspace, with a backup option. Duplicate creates a new project UUID; artifact identities remain stable inside the copy.</p></div>${p.migration?`<div class="panel"><h3>Migration report</h3><p>${p.migration.report.map(esc).join('<br>')}</p>${button('Export original legacy source','legacy-source')}</div>`:''}`}
function download(text,name,mime){const url=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function filename(ext){return (p.project.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'project')+'-r'+p.project.revision+'-'+now().slice(0,10)+'.'+ext}
function portable(data){const safe=JSON.stringify(validate(clone(data))).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');return APP_TEMPLATE.replace(/(<script id="embedded-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+safe+b)}
function exportProject(html=false){try{validate(p);download(html?portable(p):JSON.stringify(p,null,2),filename(html?'html':'json'),html?'text/html':'application/json');dirty=false;status();notice('Download requested. Keep the downloaded file as your durable snapshot.')}catch(e){notice('Export failed: '+e.message)}}

function evidencePaths(id,edges=evidenceEdges()){
  const paths=new Map([[id,[]]]),queue=[id];

  }

const statusChoices = type => type==='TC' ? ['Not Started','In Progress','Passed','Failed','Blocked','Draft','Approved'] : ['Draft','In review','Approved','Implemented','Retired'];
function compatibleRelationship(type,a,b){
  const rules={'satisfied-by':['BR','UR'],'refined-by':['BR UR FR','UR FR NFR'],'realized-by':['BR UR FR NFR RULE UC','UC FR'],'implemented-by':['FR NFR UC RULE','US'],'verified-by':['BR UR FR NFR UC RULE US','TC'],'satisfies':['UR','BR'],'derives-from':['UR FR NFR','BR UR FR'],'implements':['US','FR NFR UC RULE'],'verifies':['TC','BR UR FR NFR UC RULE US']};
  const rule=rules[type];
  return a.id!==b.id&&(!rule||(rule[0].split(' ').includes(a.type)&&rule[1].split(' ').includes(b.type)));
}
function linkPicker(id){
  const a=get(id),reverse=$('rel-direction').value==='in',selector=$('rel-type'),target=$('rel-target');
  const current=selector.value,previous=target.value;
  const eligible=(type,b)=>compatibleRelationship(type,reverse?b:a,reverse?a:b);
  const types=RELS.filter(type=>p.artifacts.some(b=>eligible(type,b)));
  selector.innerHTML=options(types,types.includes(current)?current:types[0]);
  const q=$('target-search').value;
  target.innerHTML='<option value="">Choose linked artifact</option>'+p.artifacts.filter(b=>eligible(selector.value,b)&&matches(artifactLabel(b),q)).map(b=>`<option value="${esc(b.id)}">${esc(artifactLabel(b))}</option>`).join('');
  if([...target.options].some(o=>o.value===previous))target.value=previous;
}
function links(id){
  const a=get(id),d=$('modal');
  const rows=graph(p).filter(r=>r.fromId===id||r.toId===id);
  d.innerHTML=`<h2>${esc(a.code+' · '+a.title)}</h2><p>${esc(typeLabels[a.type])} · ${esc(a.status||'No status')}</p><p>${esc(a.description)}</p><div class="row">${button('Edit artifact','edit:'+esc(id))}${a.type==='UC'?button('Open workflow','uc:'+esc(id)):''}</div>
    <h3>Relationships</h3><label>Show direction<select id="inspect-direction"><option value="">Both</option><option value="in">Incoming</option><option value="out">Outgoing</option></select></label>
    <div class="scroll">${rows.map(r=>`<div class="linkline" data-link-direction="${r.fromId===id?'out':'in'}">${r.fromId===id?'Outgoing':'Incoming'} · <strong>${esc(r.type)}</strong> · ${inspectLink(get(r.fromId===id?r.toId:r.fromId))} ${r.stepId?'· workflow step':button('Remove','remove-rel:'+esc(r.id))}</div>`).join('')||'<p>No relationships yet.</p>'}</div>
    <h3>Add a relationship</h3><div class="filter-strip"><label>Direction<select id="rel-direction"><option value="out">Outgoing</option><option value="in">Incoming</option></select></label><label>Relationship type <span title="The type determines eligible artifacts and how the link contributes to coverage." tabindex="0">ⓘ</span><select id="rel-type"><option>implemented-by</option></select></label><label>Search targets<input id="target-search" type="search" placeholder="Code, title or type"></label><label>Linked artifact<select id="rel-target"></select></label>${button('Add relationship','add-rel:'+esc(id))}</div>
    <details><summary>Change impact</summary><p class="hint">Records reachable through coverage relationships.</p>
    <h4>Upstream</h4>${reach(p,id,true).map(key=>inspectLink(get(key))).join('<br>')||'None'}
    <h4>Downstream</h4>${[...evidencePaths(id).keys()].filter(key=>key!==id).map(key=>inspectLink(get(key))).join('<br>')||'None'}</details>
    ${button('Close','close')}`;
  d.dataset.artifact=id;
  linkPicker(id);
  for(const key of ['rel-type','rel-direction','target-search'])$(key).addEventListener(key==='target-search'?'input':'change',()=>linkPicker(id));
  $('inspect-direction').onchange=e=>d.querySelectorAll('[data-link-direction]').forEach(row=>{row.hidden=!!e.target.value&&row.dataset.linkDirection!==e.target.value;});
  if(!d.open)d.showModal();
}
function newLink(){
  const d=$('modal');
  d.innerHTML=`<h2>Choose a source artifact</h2><label>Search<input type="search" id="source-search" placeholder="Code, title or type"></label><label>Source<select id="source-artifact"></select></label><button type="button" id="source-next">Continue</button> ${button('Cancel','close')}`;
  const paint=()=>{$('source-artifact').innerHTML=p.artifacts.filter(a=>matches(artifactLabel(a),$('source-search').value)).map(a=>`<option value="${esc(a.id)}">${esc(artifactLabel(a))}</option>`).join('');$('source-next').disabled=!$('source-artifact').value;};
  $('source-search').oninput=paint;$('source-next').onclick=()=>links($('source-artifact').value);paint();d.showModal();
}
function workflowFilter(){
  return filterBar(searchBox('Find workflows')+dropdown('actor','Actor',actorChoices())+dropdown('model','Diagram',[['modelled','Modelled'],['empty','Not modelled']]));
}
function workflowMatches(a){
  const scope=actorScope(),model=filterValue('model'),hasNodes=p.workflows.some(w=>w.useCaseId===a.id&&w.nodes.length);
  return (!scope||scope.has(a.id))&&matches(artifactLabel(a),filterValue('q'))&&(!model||(model==='modelled')===hasNodes);
}
function reportFindings(){
  const codes=new Set(scopedArtifacts().map(a=>a.code));
  const rows=gaps(p).filter(r=>codes.has(r[0].split(' / ')[0]));
  for(const a of scopedArtifacts().filter(a=>a.type==='TC'&&a.status!=='Passed'))rows.push([a.code,a.status==='Failed'?'Test failed':a.status==='Blocked'?'Test blocked':'Test execution pending',a.status||'No status']);
  return rows.filter(r=>!filterValue('issue')||r[1]===filterValue('issue'));
}
function v8Reports(){
  const rows=reportFindings();
  return '<div class="row between"><h2>Reports</h2><button data-export-report>Export filtered findings</button></div>'+
    filterBar(searchBox()+dropdown('type','Artifact type',typeChoices)+dropdown('actor','Actor',actorChoices())+dropdown('issue','Finding',choices([...gaps(p).map(r=>r[1]),'Test execution pending','Test failed','Test blocked'])))+
    '<p class="hint">'+rows.length+' findings in scope</p>'+table(['Artifact','Finding','Evidence'],rows.map(r=>r.map(esc)));
}
function setPageFilter(e){
  const key=e.target.dataset.filter;if(!key)return;
  activeScope()[key]=e.target.value;
  if(key==='root')delete activeScope().record;
  const selection=e.target.selectionStart;
  const canvas=$('canvas');
  const scroll=canvas&&[canvas.scrollLeft,canvas.scrollTop];
  render();
  if(scroll&&$('canvas')){[$('canvas').scrollLeft,$('canvas').scrollTop]=scroll;}
  const next=document.querySelector('[data-filter="'+key+'"]');
  if(next){next.focus();if(selection!==null)next.setSelectionRange(selection,selection);}
}
document.addEventListener('input',e=>{if(e.target.matches?.('input[data-filter]'))setPageFilter(e);});
document.addEventListener('change',e=>{if(e.target.matches?.('select[data-filter]'))setPageFilter(e);});
document.addEventListener('click',e=>{
  if(e.target.closest?.('[data-clear-filters]')){scopes[view]={};render();}
  if(e.target.closest?.('[data-new-link]'))newLink();
  if(e.target.closest?.('[data-export-rtm]'))csv([['Code','Title','Stories','Tests','Coverage','Passed','Workflows modelled','Findings'],...coverageRows().map(r=>[r.a.code,r.a.title,r.stories.map(a=>a.code).join(' | '),r.tests.map(a=>a.code+' ('+a.status+')').join(' | '),r.coverage,r.passed,r.modelled.length,r.flags.join(' | ')])],'filtered-rtm');
  if(e.target.closest?.('[data-export-report]'))csv([['Code','Finding','Evidence'],...reportFindings()],'filtered-findings');
});

const traceTypes=['BR','UR','FR','NFR','RULE'];
function actorLink(r,id){
  if(!['relates-to','related-to'].includes(r.type))return '';
  if(r.toId===id&&get(r.fromId)?.type==='ACT')return r.fromId;
  if(r.fromId===id&&get(r.toId)?.type==='ACT')return r.toId;
  return '';
}
function storyLink(r,id){
  if(r.fromId===id&&r.type==='implemented-by'&&get(r.toId)?.type==='US')return r.toId;
  if(r.toId===id&&r.type==='implements'&&get(r.fromId)?.type==='US')return r.fromId;
  return '';
}
function associationIds(id,kind){
  const identify=kind==='actor'?actorLink:storyLink;
  return [...new Set(p.relationships.map(r=>identify(r,id)).filter(Boolean))];
}
function relatedStories(id){
  const ids=new Set(associationIds(id,'story'));
  const edges=evidenceEdges().filter(e=>!e.stepId);
  for(const [key] of evidencePaths(id,edges))if(get(key)?.type==='US')ids.add(key);
  return [...ids].map(get);
}
function usedBySteps(useCaseId,actorId){
  const actor=get(actorId);
  return (p.workflows.find(w=>w.useCaseId===useCaseId)?.nodes||[]).filter(n=>n.actorId?n.actorId===actorId:actor&&n.actor===actor.title);
}
function contextMarkup(id){
  const actors=associationIds(id,'actor').map(get),stories=relatedStories(id);
  const display=items=>items.map(inspectLink).join('<br>')||'None linked';
  return `<div class="uc-context"><b>Use case participants</b><div>${display(actors)}</div><b>Related user stories</b><div>${display(stories)}</div></div>`;
}
function associationFields(a){
  return `<section class="uc-context" aria-label="Use case associations">
    <h3>Use case associations</h3>
    <p class="hint">Participants are available in each step’s Performed by dropdown. Stories describe the goal that this use case helps deliver.</p>
    <div id="actor-associations"></div><div id="story-associations"></div>
    <p id="association-message" class="hint" role="status"></p>
    ${a.id?`<p class="hint">Stories reached through requirements appear in workflow context and the RTM.</p>`:''}
  </section>`;
}
function bindAssociationFields(form,a){
  const selected={actor:associationIds(a.id,'actor'),story:associationIds(a.id,'story')};
  function paint(kind){
    const holder=$(kind+'-associations');if(!holder)return;
    const label=kind==='actor'?'Add actor':'Add related user story';
    const items=p.artifacts.filter(x=>x.type===(kind==='actor'?'ACT':'US')&&!selected[kind].includes(x.id));
    holder.innerHTML=`<label>${label}<select data-add-association="${kind}"><option value="">${items.length?'Choose an available '+kind:'No available '+(kind==='actor'?'actors':'stories')}</option>${items.map(x=>`<option value="${esc(x.id)}">${esc(artifactLabel(x))}</option>`).join('')}</select></label>
      <div class="association-chips">${selected[kind].map(id=>`<span class="association-chip">${esc(get(id)?.title)} <button type="button" data-remove-association="${esc(id)}" aria-label="Remove ${esc(get(id)?.title)}">×</button></span>`).join('')||'<span class="hint">None selected</span>'}</div>`;
    holder.querySelector('select').onchange=e=>{
      if(!e.target.value)return;
      selected[kind].push(e.target.value);paint(kind);
      holder.querySelector('select').focus();
    };
    for(const b of holder.querySelectorAll('[data-remove-association]'))b.onclick=()=>{
      const id=b.dataset.removeAssociation,steps=kind==='actor'?usedBySteps(a.id,id):[];
      if(steps.length){$('association-message').textContent='Reassign or clear the actor on these steps before removing them: '+steps.map(n=>n.code+' '+n.title).join(', ');return;}
      selected[kind]=selected[kind].filter(x=>x!==id);$('association-message').textContent='';paint(kind);
      holder.querySelector('select').focus();
    };
  }
  form.associationDraft=selected;
  paint('actor');paint('story');
}
function saveAssociations(id,selected){
  if(!selected)return;
  for(const [kind,identify] of [['actor',actorLink],['story',storyLink]]){
    const ids=selected[kind],current=associationIds(id,kind);
    p.relationships=p.relationships.filter(r=>{const key=identify(r,id);return !key||ids.includes(key);});
    for(const key of ids.filter(x=>!current.includes(x))){
      p.relationships.push(kind==='actor'?{id:uid(),fromId:key,toId:id,type:'relates-to'}:{id:uid(),fromId:id,toId:key,type:'implemented-by'});
    }
  }
}
function performerField(n){
  const actors=associationIds(uc,'actor').map(get);
  const legacy=!n.actorId&&n.actor&&!actors.some(a=>a.title===n.actor);
  return `<label>Performed by<select name="actorId"><option value="">Unassigned</option>${actors.map(a=>`<option value="${esc(a.id)}" ${(n.actorId===a.id||(!n.actorId&&n.actor===a.title))?'selected':''}>${esc(a.title)}</option>`).join('')}${legacy?`<option value="@legacy" selected>${esc(n.actor)} (imported text)</option>`:''}</select></label><p class="hint">Manage eligible actors in Edit use case.</p>`;
}
function writeStepField(n,k,v){
  if(k!=='actorId'){n[k]=v;return;}
  if(v==='@legacy')return;
  n.actorId=v;
  n.actor=get(v)?.title||'';
}
function stepTrace(n){
  const targets=p.artifacts.filter(a=>traceTypes.includes(a.type)&&!(n.traceIds||[]).includes(a.id));
  const criteria=relatedStories(uc).flatMap(a=>a.acceptanceCriteria.map((c,i)=>({a,c,i}))).filter(({a,c})=>!(n.traceCriteria||[]).some(ref=>ref.storyId===a.id&&ref.criterionId===c.id));
  const criterionLinks=(n.traceCriteria||[]).map((ref,i)=>{
    const a=get(ref.storyId),c=a.acceptanceCriteria.find(c=>c.id===ref.criterionId);
    return `<span class="association-chip">${inspectLink(a)} · ${esc(c.then||c.when||c.given||'Acceptance criterion')} <button type="button" data-remove-step-criterion="${i}" aria-label="Remove criterion trace">×</button></span>`;
  }).join('');
  return `<details class="uc-context"><summary>Optional step trace</summary>
    <p class="hint">Link a requirement, rule or acceptance criterion that applies to this step.</p>
    <label>Add requirement or rule<select id="step-trace-add"><option value="">Choose an artifact</option>${targets.map(a=>`<option value="${esc(a.id)}">${esc(artifactLabel(a))}</option>`).join('')}</select></label>
    <div class="association-chips">${(n.traceIds||[]).map(id=>`<span class="association-chip">${inspectLink(get(id))}<button type="button" data-remove-step-trace="${esc(id)}" aria-label="Remove ${esc(get(id)?.code)}">×</button></span>`).join('')}</div>
    <label>Add acceptance criterion<select id="step-criterion-add"><option value="">${criteria.length?'Choose a criterion':'No criteria on related stories'}</option>${criteria.map(({a,c,i})=>`<option value="${esc(JSON.stringify([a.id,i]))}">${esc(a.code+' · '+(c.then||c.when||c.given||'Criterion '+(i+1)))}</option>`).join('')}</select></label>
    <div class="association-chips">${criterionLinks}</div>
    ${n.storyIds.length?`<p class="hint">Imported step story links</p>${n.storyIds.map(id=>inspectLink(get(id))).join('<br>')}`:''}
  </details>`;
}
function bindStepTrace(n){
  const picker=$('step-trace-add');if(!picker)return;
  const update=(change,focus='step-trace-add')=>{commit(change,'Step trace updated',false);inspect();$(focus).closest('details').open=true;$(focus).focus();};
  picker.onchange=()=>{if(picker.value)update(()=>{n.traceIds=[...(n.traceIds||[]),picker.value];});};
  for(const b of document.querySelectorAll('[data-remove-step-trace]'))b.onclick=()=>update(()=>{n.traceIds=n.traceIds.filter(id=>id!==b.dataset.removeStepTrace);});
  const criterion=$('step-criterion-add');
  criterion.onchange=()=>{
    if(!criterion.value)return;
    const [storyId,index]=JSON.parse(criterion.value),c=get(storyId).acceptanceCriteria[index];
    update(()=>{c.id||=uid();n.traceCriteria=[...(n.traceCriteria||[]),{storyId,criterionId:c.id}];},'step-criterion-add');
  };
  for(const b of document.querySelectorAll('[data-remove-step-criterion]'))b.onclick=()=>update(()=>{
    n.traceCriteria=n.traceCriteria.filter((_,i)=>i!==Number(b.dataset.removeStepCriterion));
  },'step-criterion-add');
}
function guardActorLinkRemoval(r){
  for(const id of [r.fromId,r.toId]){
    const actorId=actorLink(r,id);
    if(!actorId)continue;
    const another=p.relationships.some(x=>x.id!==r.id&&actorLink(x,id)===actorId);
    if(!another&&usedBySteps(id,actorId).length)throw Error('Reassign or clear this actor on its workflow steps before removing the association.');
  }
}

try{const embedded=JSON.parse($('embedded-data').textContent||'null');if(embedded){p=migrate(embedded).data;notice('Opened embedded portable snapshot.')}else{try{p.settings.autosaveEnabled=localStorage.getItem(PREF)==='true'}catch(e){notice('Browser storage unavailable. JSON and HTML exports remain available.')}}render();try{if(localStorage.getItem(KEY))notice('A browser recovery copy is available in Save & handoff. It has not replaced this snapshot.')}catch(e){notice('Browser storage unavailable. Export JSON for a durable backup.')}}catch(e){render();notice('Embedded project could not be loaded: '+e.message+'. Original HTML remains unchanged; keep it for recovery.')}

function coverageSummary(){const edges=semantic(p);return '<div class="panel tablewrap"><table><tr><th>Level</th><th>Direct test coverage</th><th>Transitive only</th><th>No test coverage</th></tr>'+TYPES.filter(t=>t!=='TC').map(t=>{let direct=0,transitive=0,none=0;for(const a of p.artifacts.filter(a=>a.type===t)){if(edges.some(e=>e.fromId===a.id&&get(e.toId)?.type==='TC'))direct++;else if(reach(p,a.id).some(id=>get(id)?.type==='TC'))transitive++;else none++}return '<tr><td>'+t+'</td><td>'+direct+'</td><td>'+transitive+'</td><td>'+none+'</td></tr>'}).join('')+'</table></div>'}

</script></body></html>
